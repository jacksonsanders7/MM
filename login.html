<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mentor Moose • Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container page-main">
      <section class="card narrow">
        <h1>Login</h1>
        <p class="meta">Admin, student, and tutor login.</p>
        <form id="loginForm" class="account-form">
          <label>
            Role
            <select id="role" required>
              <option value="student">Student</option>
              <option value="tutor">Tutor</option>
              <option value="admin">Admin</option>
            </select>
          </label>
          <label>
            Email / Username
            <input id="identifier" type="text" required />
          </label>
          <label>
            Password
            <input id="password" type="password" required />
          </label>
          <button class="btn" type="submit">Login</button>
        </form>
        <p id="loginMessage" class="success-message" aria-live="polite"></p>
        <p><a href="index.html">Back to home</a></p>
      </section>
    </main>
    <script src="login.js"></script>
  </body>
</html>
